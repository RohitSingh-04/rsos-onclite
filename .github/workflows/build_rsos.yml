name: Build RSOS for Xiaomi Redmi Y3 (onclite)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'device_overlay/bootanimation/preview.gif'

jobs:
  build:
    name: Assemble Full RSOS Android 16 ROM (~1.2 GB)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout RSOS onclite Repository
        uses: actions/checkout@v4

      - name: Setup Tools & Dependencies
        run: |
          sudo apt-get update -y || true
          sudo apt-get install -y curl wget xz-utils zip unzip android-sdk-libsparse-utils e2fsprogs python3

      - name: Execute RSOS Fast ROM Assembler
        run: |
          chmod +x build_rsos_rom.sh
          ./build_rsos_rom.sh "$GITHUB_WORKSPACE/output"

      - name: Upload Full Flashable ROM ZIP (~1.2 GB)
        uses: actions/upload-artifact@v4
        with:
          name: RSOS-Android16-onclite-FULL-ROM
          path: |
            output/*.zip
            output/*.sha256
            output/*.md5
          retention-days: 14
